<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>周天破境录 · 斗法场景原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#04070a;overflow:hidden;color:#e9f3ef;font-family:'Noto Serif SC','Songti SC','SimSun',serif;user-select:none}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:#0a141a}
#cv{position:absolute;left:0;top:0;width:1600px;height:900px;transition:filter 1.4s ease}
#cv.dead{filter:grayscale(.9) contrast(1.15) brightness(.75)}
.cal{font-family:'Ma Shan Zheng','STKaiti','KaiTi',serif}
/* HUD */
.hud{position:absolute;top:16px;padding:10px 22px 10px 18px;background:linear-gradient(90deg,rgba(6,20,24,.88),rgba(6,20,24,.55));border:1px solid rgba(214,178,98,.55);box-shadow:0 0 18px rgba(0,0,0,.45),inset 0 0 14px rgba(120,230,210,.08);clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%)}
#hudL{left:18px;width:500px}
#hudR{right:18px;width:540px;text-align:right}
.realm{display:flex;gap:10px;align-items:baseline;font-size:15px;color:#b9cfc8}
.realm b{font-family:'Ma Shan Zheng',serif;font-size:30px;font-weight:400;color:#f4e2b1;letter-spacing:2px;text-shadow:0 0 10px rgba(255,210,120,.5)}
.qirow{display:flex;align-items:center;gap:10px;margin-top:4px}
.lab{font-size:14px;color:#9fd8c4;letter-spacing:2px}
.bar{position:relative;flex:1;height:14px;border-radius:7px;background:rgba(0,0,0,.55);border:1px solid rgba(214,178,98,.5);overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:linear-gradient(90deg,#2f8f7d,#7fffe0);box-shadow:0 0 12px rgba(127,255,224,.6);transition:width .5s ease}
.bar em{position:absolute;top:-5px;bottom:-5px;width:3px;background:#ff5a4a;box-shadow:0 0 8px #ff5a4a;transition:left .5s ease}
.bar.red i{background:linear-gradient(90deg,#6d0f12,#ff4136);box-shadow:0 0 14px rgba(255,65,54,.7);transition:none}
#qiTxt{min-width:64px;text-align:right;font-size:20px;color:#e9fff8}
.sub{margin-top:5px;font-size:13px;color:#a9bdb7}
.sub .warn{color:#ff7a6a}
.foename{font-family:'Ma Shan Zheng',serif;font-size:30px;color:#f4d7a1;letter-spacing:2px;text-shadow:0 0 12px rgba(255,80,60,.55);margin-bottom:6px}
#hudR .bar{margin-left:40px}
#tools{position:absolute;left:22px;top:118px;display:flex;flex-direction:column;gap:10px}
#tools button{width:46px;height:46px;border-radius:50%;border:1px solid rgba(214,178,98,.7);background:radial-gradient(circle at 40% 35%,rgba(40,80,76,.95),rgba(8,22,22,.95));color:#f3e2b0;font-family:'Ma Shan Zheng',serif;font-size:22px;cursor:pointer;box-shadow:0 0 12px rgba(0,0,0,.5)}
#tools button:hover{box-shadow:0 0 14px rgba(127,255,224,.5)}
#hint{position:absolute;left:50%;top:112px;transform:translateX(-50%);max-width:880px;padding:8px 22px;border-radius:20px;background:rgba(4,14,16,.72);border:1px solid rgba(127,255,224,.25);font-size:16px;color:#dff5ee;text-align:center;pointer-events:none;transition:opacity .3s}
#hint b{color:#ffd27a;font-weight:700}
#toast{position:absolute;left:50%;top:170px;transform:translateX(-50%);padding:10px 28px;font-size:22px;color:#fff3d0;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(10,10,10,.7),rgba(0,0,0,0));opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .35s}
#toast.on{opacity:1}
#tally{position:absolute;left:50%;top:160px;transform:translateX(-50%);font-family:'Ma Shan Zheng',serif;font-size:44px;color:#ffe6a6;text-shadow:0 0 16px rgba(255,190,80,.8);opacity:0;pointer-events:none;transition:opacity .3s}
#tally.on{opacity:1}
/* slots */
#slots{position:absolute;inset:0;pointer-events:none}
.slotbtn{position:absolute;width:96px;height:56px;margin:-38px 0 0 -48px;border-radius:50%;border:0;background:transparent;cursor:pointer;pointer-events:auto;outline:none}
.slotbtn:focus-visible{box-shadow:0 0 0 2px #ffd27a}
#menu{position:absolute;display:flex;gap:6px;padding:6px;background:rgba(5,16,18,.94);border:1px solid rgba(214,178,98,.7);border-radius:8px;z-index:6}
#menu button,.btn{font-family:'Noto Serif SC',serif;font-size:14px;padding:6px 12px;border-radius:5px;border:1px solid rgba(127,255,224,.4);background:rgba(30,70,64,.8);color:#e9fff8;cursor:pointer}
#menu button:disabled{opacity:.4;cursor:not-allowed}
#menu button:hover:not(:disabled),.btn:hover{background:rgba(50,110,100,.9)}
/* hand */
#tray{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);padding:10px 26px 8px;min-width:360px;max-width:1040px;background:linear-gradient(180deg,rgba(150,220,205,.10),rgba(20,50,48,.55));border:1px solid rgba(160,230,215,.35);border-bottom:0;border-radius:10px 10px 0 0;box-shadow:inset 0 10px 30px rgba(127,255,224,.08)}
#hand{display:flex;justify-content:center;align-items:flex-end;height:142px;padding-top:22px;overflow-x:auto;overflow-y:visible;scrollbar-width:thin}
.card{position:relative;flex:0 0 auto;width:62px;height:126px;margin:0 -4px;border-radius:6px;border:1px solid rgba(220,255,240,.55);background:linear-gradient(160deg,#cdebdc 0%,#8cc5ad 45%,#4f8f78 100%);box-shadow:0 6px 14px rgba(0,0,0,.45),inset 0 0 10px rgba(255,255,255,.35);cursor:pointer;transition:transform .18s,box-shadow .18s;color:#12302a;padding:0}
.card:hover{transform:translateY(-10px)}
.card.sel{transform:translateY(-24px);box-shadow:0 0 22px rgba(255,220,130,.9),0 6px 14px rgba(0,0,0,.45)}
.card.fuelable{box-shadow:0 0 16px rgba(255,110,80,.9)}
.card .cap{position:absolute;left:0;right:0;top:0;height:9px;border-radius:6px 6px 0 0}
.cat-C .cap{background:#2fd4b4}.cat-A .cap{background:#e6b04e}.cat-R .cap{background:#e0583e}
.card .nm{position:absolute;left:0;right:0;top:16px;writing-mode:vertical-rl;margin:0 auto;font-family:'Ma Shan Zheng',serif;font-size:30px;line-height:1;letter-spacing:4px}
.card .lv{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:12px;color:#173c34;font-weight:700}
.empty-hand{color:#9fbfb6;font-size:14px;padding-bottom:40px}
/* run button */
.orb{position:absolute;width:112px;height:112px;border-radius:50%;border:3px solid #cfa85a;background:radial-gradient(circle at 40% 32%,#3f7a72,#0e2624 70%);color:#f6e6b6;font-family:'Ma Shan Zheng',serif;font-size:38px;cursor:pointer;box-shadow:0 0 26px rgba(127,255,224,.35),inset 0 0 18px rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.orb small{font-family:'Noto Serif SC',serif;font-size:13px;color:#ffb3a6;margin-top:6px}
.orb:hover:not(:disabled){box-shadow:0 0 36px rgba(127,255,224,.65),inset 0 0 18px rgba(0,0,0,.6)}
.orb:disabled{filter:grayscale(.7) brightness(.7);cursor:default}
#bRun{right:28px;bottom:26px}
/* splash */
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.splash{position:absolute;transform:translate(-50%,-50%);font-family:'Ma Shan Zheng',serif;white-space:nowrap;filter:drop-shadow(0 0 14px rgba(255,200,90,.85)) drop-shadow(0 0 40px rgba(255,160,60,.45))}
.splash span{display:block;background:linear-gradient(180deg,#fffbe8 0%,#f6cf72 50%,#a8701c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;animation:ink var(--d,1.6s) cubic-bezier(.2,.8,.2,1) forwards}
.splash.red{filter:drop-shadow(0 0 16px rgba(255,40,30,.9)) drop-shadow(0 0 50px rgba(120,0,0,.8))}
.splash.red span{background:linear-gradient(180deg,#ffd9d0,#ff3b2e 55%,#5a0606)}
.splash.teal{filter:drop-shadow(0 0 14px rgba(127,255,224,.85))}
.splash.teal span{background:linear-gradient(180deg,#f4fffb,#7fffe0 55%,#1d7a68)}
@keyframes ink{0%{opacity:0;transform:scale(1.9);letter-spacing:.4em}16%{opacity:1;transform:scale(1);letter-spacing:.06em}78%{opacity:1;transform:scale(1.03)}100%{opacity:0;transform:scale(1.08)}}
/* modal */
#modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(0,0,0,.35),rgba(0,0,0,.78));z-index:10}
.panel{min-width:620px;max-width:980px;padding:28px 36px 30px;background:linear-gradient(180deg,rgba(10,28,30,.96),rgba(5,14,16,.96));border:1px solid rgba(214,178,98,.75);box-shadow:0 0 40px rgba(127,255,224,.15);text-align:center;animation:pop .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{0%{opacity:0;transform:scale(.9)}100%{opacity:1;transform:scale(1)}}
.ptitle{font-family:'Ma Shan Zheng',serif;font-size:54px;color:#f6dc9a;text-shadow:0 0 18px rgba(255,200,100,.6);letter-spacing:6px}
.ptitle.red{color:#ff6a5a;text-shadow:0 0 22px rgba(255,30,20,.8)}
.psub{color:#b6cbc4;margin:6px 0 20px;font-size:15px}
.opts{display:flex;gap:18px;justify-content:center}
.opt{width:220px;padding:16px 14px;border-radius:8px;border:1px solid rgba(160,230,215,.45);background:linear-gradient(180deg,rgba(40,90,82,.55),rgba(10,30,30,.8));color:#e9fff8;cursor:pointer;text-align:center;transition:transform .15s,box-shadow .15s}
.opt:hover{transform:translateY(-6px);box-shadow:0 0 22px rgba(255,210,120,.55)}
.opt .g{font-family:'Ma Shan Zheng',serif;font-size:58px;line-height:1.1}
.opt.cat-C .g{color:#7fffe0}.opt.cat-A .g{color:#ffd27a}.opt.cat-R .g{color:#ff8a6a}
.opt .n{font-size:18px;font-weight:700;margin:4px 0}
.opt .d{font-size:13px;color:#b9d2ca;line-height:1.5;min-height:58px}
.stats{display:flex;gap:30px;justify-content:center;margin:8px 0 22px;color:#cfe3dc}
.stats b{display:block;font-family:'Ma Shan Zheng',serif;font-size:36px;color:#ffe2a0}
.book{text-align:left;max-height:520px;overflow:auto;font-size:14px;line-height:1.7;color:#d5e7e1}
.book h4{margin:12px 0 4px;color:#ffd27a;font-size:15px}
.book .row{display:flex;gap:10px;padding:3px 0;border-bottom:1px dashed rgba(160,230,215,.15)}
.book .row b{width:72px;flex:0 0 auto}
.bigbtn{margin-top:8px;font-family:'Ma Shan Zheng',serif;font-size:30px;padding:8px 40px;border-radius:6px;border:1px solid #cfa85a;background:radial-gradient(circle at 50% 30%,#3f7a72,#0e2624);color:#f6e6b6;cursor:pointer}
.bigbtn:hover{box-shadow:0 0 22px rgba(127,255,224,.5)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1600" height="900"></canvas>
  <div id="hudL" class="hud">
    <div class="realm"><span>境界</span><b id="realmTxt">炼气期 · 初期</b></div>
    <div class="qirow"><span class="lab">修为</span><div class="bar"><i id="qiFill"></i><em id="costMark"></em></div><b id="qiTxt">100</b></div>
    <div class="sub" id="costTxt"></div>
  </div>
  <div id="hudR" class="hud">
    <div class="foename" id="foeTxt"></div>
    <div class="bar red"><i id="foeFill"></i></div>
    <div class="sub" id="thTxt"></div>
  </div>
  <div id="tools">
    <button id="bMute" title="声音开关" aria-label="声音开关">音</button>
    <button id="bBook" title="道韵图鉴与规则" aria-label="道韵图鉴与规则">鉴</button>
    <button id="bReset" title="重修一世" aria-label="重新开始">重</button>
  </div>
  <div id="hint"></div>
  <div id="toast"></div>
  <div id="tally"></div>
  <div id="slots"></div>
  <div id="menu" hidden></div>
  <div id="tray"><div id="hand"></div></div>
  <button id="bRun" class="orb" aria-label="运转周天">周天<small id="runCost"></small></button>
  <div id="fx"></div>
  <div id="modal" hidden></div>
</div>

}

}

          ev.push({ type: 'move', t: P.t, pid: c.id, from: [P.r, P.s], to: [c.r, c.s], kind: 'split', b: c.base, m: c.mult });

/* ---------------- 每帧更新 ---------------- */
function update(dt, rdt) {
  T += dt;
  // 演出时间轴
  if (beam) { beam.t += dt; if (beam.t > beam.dur + .3) beam = null; }
  if (play && !play.resolved) {
    play.tc += dt;
    while (play.ti < play.tl.length && play.tl[play.ti].at <= play.tc) { play.tl[play.ti].fn(); play.ti++; }
    if (play.tc >= play.end && proj.length === 0) resolveTurn();
    else if (play.tc > play.end + 6) { proj.length = 0; resolveTurn(); }
  }
  // 飞剑 / 灵爆
  for (let i = proj.length - 1; i >= 0; i--) {
    const p = proj[i]; p.t += dt;
    if (p.t < 0) { if (p.kind === 'orb') p.charge = Math.min(1, p.charge + dt * 3.5); continue; }
    const k = Math.min(1, p.t / p.dur), e = p.kind === 'orb' ? k * k : 1 - Math.pow(1 - k, 2);
    const u = 1 - e;
    p.x = u * u * p.x0 + 2 * u * e * p.cx + e * e * p.x1; p.y = u * u * p.y0 + 2 * u * e * p.cy + e * e * p.y1;
    const dx = 2 * u * (p.cx - p.x0) + 2 * e * (p.x1 - p.cx), dy = 2 * u * (p.cy - p.y0) + 2 * e * (p.y1 - p.cy);
    p.a = Math.atan2(dy, dx);
    p.trail.push([p.x, p.y]); if (p.trail.length > (p.kind === 'orb' ? 22 : 12)) p.trail.shift();
    if (k >= 1) {
      proj.splice(i, 1);
      if (p.kind === 'orb') { spark(p.x, p.y, 60, GL.gold, 420, .9, 16); ringWave(p.x, p.y, '255,200,110', 260, .7); flash = Math.max(flash, .25); flashColor = '255,220,160'; SFX.boom(); }
      else { spark(p.x, p.y, 10, GL.teal, 240, .5, 8); SFX.sword(); foeHit = Math.max(foeHit, .5); foeKnock = Math.max(foeKnock, 8); shake = Math.max(shake, 3); }
      if (p.dmg && !p.dmg.done) { p.dmg.done = true; hitDamage(p.dmg.qi); }
    }
  }
  // 粒子
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt; if (p.life <= 0) { parts.splice(i, 1); continue; }
    if (p.wave) { p.r += (p.maxR - p.r) * Math.min(1, dt * 6); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.pow(p.drag, dt * 60); p.vy *= Math.pow(p.drag, dt * 60); p.vy += 30 * dt;
  }
  for (let i = ash.length - 1; i >= 0; i--) {
    const p = ash[i]; if (p.delay > 0) { p.delay -= dt; continue; }
    p.life -= dt; if (p.life <= 0) { ash.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx += 25 * dt; p.vy -= 10 * dt;
  }
  for (let i = smokes.length - 1; i >= 0; i--) { const s = smokes[i]; s.life -= dt; if (s.life <= 0) { smokes.splice(i, 1); continue; } s.x += s.vx * dt; s.y += s.vy * dt; s.r += 30 * dt; }
  for (let i = bolts.length - 1; i >= 0; i--) { bolts[i].life -= dt; if (bolts[i].life <= 0) bolts.splice(i, 1); }
  for (let i = floats.length - 1; i >= 0; i--) { const f = floats[i]; f.life -= dt; f.pop += dt; f.y -= 34 * dt; if (f.life <= 0) floats.splice(i, 1); }
  // 环境：魔修周身黑气与血色雷光
  if (!foeDead && foeAlpha > .3 && Math.random() < dt * 22) {
    const b = foeBox();
    smokes.push({ x: b.x + b.w * (.15 + Math.random() * .6), y: b.y + b.h * (.3 + Math.random() * .7), vx: 10 + Math.random() * 30, vy: -20 - Math.random() * 30, r: 20 + Math.random() * 30, life: 1.8, max: 1.8 });
  }
  nextAmbientBolt -= dt;
  if (nextAmbientBolt <= 0 && !foeDead && foeAlpha > .5) {
    nextAmbientBolt = 1 + Math.random() * 2.4;
    const b = foeBox(), x0 = b.x + b.w * (.2 + Math.random() * .3), y0 = b.y + b.h * .15;
    makeBolt(x0, y0, x0 + (Math.random() - .3) * 260, y0 - 60 - Math.random() * 160, '255,70,70', .16, 2);
    if (Math.random() < .5) makeBolt(x0, y0 + 40, x0 + 120 + Math.random() * 140, y0 + Math.random() * 200, '255,90,90', .14, 1.5);
  }
  for (const f of fogs) { f.x += f.v * dt; if (f.x > W + 300) f.x = -400; }
  for (const m of motes) { m.y -= m.v * dt; m.x += Math.sin(T + m.p) * 8 * dt; if (m.y < -20) { m.y = H + 20; m.x = Math.random() * W; } }
  // 衰减
  shake *= Math.pow(.04, rdt); flash = Math.max(0, flash - rdt * 1.6); foeHit = Math.max(0, foeHit - rdt * 4); heroHit = Math.max(0, heroHit - rdt * 2.5);
  heroCast = Math.max(0, heroCast - rdt * .8); foeKnock *= Math.pow(.02, rdt);
  if (!foeDead && foeAlpha < 1) foeAlpha = Math.min(1, foeAlpha + dt * 1.2);
  for (let r = 0; r < 3; r++) for (let s = 0; s < SIZES[r]; s++) slotFx[r][s] = Math.max(0, slotFx[r][s] - dt * 1.6);
  // 敌人护体条
  const th = stage().th;
  G.shownDisp += (G.shown - G.shownDisp) * Math.min(1, rdt * 6);
  $('foeFill').style.width = Math.max(0, (1 - G.shownDisp / th) * 100) + '%';
}

function drawBG() {

  if (IMG.bg.complete && IMG.bg.naturalWidth) ctx.drawImage(IMG.bg, -45 - mouseX * 30, Math.min(0, H - bh) / 2 - 10 - mouseY * 16, bw, Math.max(bh, H + 30));

}
